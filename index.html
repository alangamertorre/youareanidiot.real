<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUAREANIDIOT</title>
</head>

<body>

    <!-- Muro de inicio optimizado -->
    <div id="muro-inicio"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: brown; z-index: 10000; color: azure; font-size: 70px; display: flex; justify-content: center; align-items: center; cursor: pointer;">
        <a onclick="playOn()" class="a1" style="color: azure; text-decoration: none;">Haz click aquí</a>
    </div>
    <div class="false-btn"
        style="height: 70px; width: 70px; position: fixed; top: 10px; left: 20px; z-index: 10001; cursor: pointer; display: none;">
        <svg view-box="70 70 70" width="70" height="70" onclick="playOn()">
            <line x1="0" y1="0" x2="70" y2="70" style="stroke: rgb(197, 13, 13); stroke-width: 2px;" />
            <line x1="70" y1="0" x2="0" y2="70" style="stroke: rgb(182, 9, 9); stroke-width: 2px;" />
        </svg>
        <p style="color: black; position: fixed; left: 45px; right: 45px;">Cerrar</p>
    </div>

    <!-- Etiqueta de audio con la URL pública alternativa que no bloquea CORS -->
    <audio id="audio-broma" loop crossorigin="anonymous">
        <source src="youare.mp3" type="audio/mp3">
    </audio>

    <!-- El iframe original se mantiene para el diseño de la web -->
    <iframe src="https://youareanidiot.cc/lol.html" id="mi-iframe"
        style="position: fixed; top: 0; right: 0; width: 90%; height: 100%; border: none; user-select: none;"></iframe>

    <script>
        const iframe = document.getElementById('mi-iframe');
        const audio = document.getElementById('audio-broma');
        const muro = document.getElementById('muro-inicio');

        function requestFullScreen(todocosta) {
            const el = document.documentElement;
            if (todocosta === true) {
                el.requestFullscreen();
            } else {
                if (el.requestFullscreen) {
                    el.requestFullscreen();
                } else if (el.mozRequestFullScreen) {
                    el.mozRequestFullScreen();
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                }
            }
        }

        function playOn() {
            // Ocultar el panel marrón de presentación
            muro.style.display = 'none';
            document.querySelector('.false-btn').style.display = 'block';

            requestFullScreen();


            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const gainNode = audioCtx.createGain(); // Crea el controlador de ganancia

            // CORRECCIÓN: Se accede a .gain.value
            gainNode.gain.value = 10.0;

            // Conectar los nodos
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            audio.play();
        }

        document.addEventListener('click', (e) => {
            requestFullScreen(true);
        });
    </script>
</body>

</html>
