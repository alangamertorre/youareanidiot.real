<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUAREANIDIOT</title>
</head>

<body>

    <!-- Muro de inicio optimizado -->
    <div id="muro-inicio"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: brown; z-index: 10000; color: azure; font-size: 70px; display: flex; justify-content: center; align-items: center; cursor: pointer;">
        <a onclick="playOn()" class="a1" style="color: azure; text-decoration: none;">Haz click aquí</a>
    </div>
    <div class="false-btn"
        style="height: 20px; width: 20px; position: fixed; top: 10px; right: 10px; z-index: 10001; cursor: pointer;">
        <svg view-box="20 20 20" width="20" height="20" onclick="playOn()">
            <line x1="0" y1="0" x2="20" y2="20" style="stroke: azure; stroke-width: 2px;" />
            <line x1="20" y1="0" x2="0" y2="20" style="stroke: azure; stroke-width: 2px;" />
        </svg><!--Btn cierre, parecido al de google-->
    </div>

    <!-- Etiqueta de audio con la URL pública alternativa que no bloquea CORS -->
    <audio id="audio-broma" loop crossorigin="anonymous">
        <source src="youare.mp3" type="audio/mp3">
    </audio>

    <!-- El iframe original se mantiene para el diseño de la web -->
    <iframe src="https://youareanidiot.cc/" id="mi-iframe"
        style="position: fixed; top: 0; right: 0; width: 90%; height: 100%; border: none; user-select: none;"></iframe>

    <!-- Capa protectora transparente para evitar interacción con el iframe -->
    <div style="position: fixed; top: 0; right: 0; width: 90%; height: 100%; z-index: 9999; background: transparent;">
    </div>

    <script>
        const iframe = document.getElementById('mi-iframe');
        const audio = document.getElementById('audio-broma');
        const muro = document.getElementById('muro-inicio');

        function requestFullScreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen();
            } else if (el.mozRequestFullScreen) {
                el.mozRequestFullScreen();
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            } else if (el.msRequestFullscreen) {
                el.msRequestFullscreen();
            }
        }

        function playOn() {
            // Ocultar el panel marrón de presentación
            muro.style.display = 'none';

            requestFullScreen();
            audio.play();
        }

    </script>
</body>

</html>
